<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarGlobal · Property Intelligence</title>
<style>
  :root{
    --ink:#0b0c0e; --panel:#141619; --panel-2:#1a1d21; --line:#272b31;
    --txt:#ece9e4; --dim:#9ba1aa; --faint:#6b717a;
    --gold:#c8a862; --gold-dim:#8a7440;
    --serif:"Hoefler Text",Garamond,Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:var(--txt);font:16px/1.6 var(--sans);
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:0 24px}

  header{border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#121417 0%,var(--ink) 100%)}
  .brand{display:flex;align-items:baseline;gap:14px;padding:30px 0 8px}
  .brand h1{margin:0;font:400 27px/1 var(--serif);letter-spacing:.055em}
  .brand h1 em{font-style:normal;color:var(--gold)}
  .rule{height:1px;background:linear-gradient(90deg,var(--gold-dim),transparent);
    width:72px;margin:14px 0 10px}
  .tag{color:var(--dim);font-size:14.5px;margin:0 0 4px;max-width:60ch}
  .prov{display:flex;flex-wrap:wrap;gap:20px;padding:14px 0 24px;
    color:var(--faint);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
  .prov b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}

  /* Leaves room for the sticky composer so the last line never hides behind it. */
  #log{padding:28px 0 4px;scroll-padding-bottom:140px}
  main{padding-bottom:120px}
  .turn{margin-bottom:26px;animation:rise .32s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .who{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin-bottom:8px}
  .me .body{background:var(--panel-2);border-left:2px solid var(--gold-dim);
    padding:12px 16px;border-radius:0 6px 6px 0;color:var(--txt)}
  .bot .body{color:var(--txt)}
  .bot .body h3{font:400 18px/1.4 var(--serif);margin:18px 0 8px;color:var(--gold);
    letter-spacing:.02em}
  .bot .body h3:first-child{margin-top:0}
  .bot .body p{margin:0 0 11px}
  .bot .body ul{margin:0 0 12px;padding-left:19px}
  .bot .body li{margin:4px 0}
  .bot .body strong{color:#fff;font-weight:600}
  .bot .body a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold-dim);
    word-break:break-word}
  .bot .body a:hover{color:#e3c88a}

  .cards{display:grid;gap:12px;margin:16px 0 4px;
    grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:15px 16px;transition:border-color .18s,transform .18s;display:block;
    text-decoration:none;color:inherit}
  .card:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
  .card .price{font:400 21px/1.2 var(--serif);color:var(--gold);
    font-variant-numeric:tabular-nums}
  .card .cur{font-size:12px;color:var(--faint);letter-spacing:.1em;margin-left:5px}
  .card .where{color:var(--txt);font-size:14px;margin:8px 0 2px}
  .card .sub{color:var(--faint);font-size:12.5px}
  .card .meta{display:flex;gap:14px;margin-top:11px;padding-top:11px;
    border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;
    font-variant-numeric:tabular-nums}
  .card .badge{position:absolute}
  .deal{display:inline-block;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--faint);border:1px solid var(--line);
    border-radius:3px;padding:1px 6px;margin-bottom:9px}

  .trace{color:var(--faint);font-size:11.5px;letter-spacing:.09em;
    text-transform:uppercase;margin-top:12px}
  .trace span{color:var(--dim)}

  .dots span{display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--gold-dim);margin-right:4px;animation:blink 1.3s infinite}
  .dots span:nth-child(2){animation-delay:.18s}
  .dots span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .chips{display:flex;flex-wrap:wrap;gap:9px;padding:4px 0 20px}
  .chips button{background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:8px 15px;font-size:13.5px;cursor:pointer;
    font-family:inherit;transition:border-color .18s,color .18s}
  .chips button:hover{border-color:var(--gold-dim);color:var(--txt)}

  .composer{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--ink) 22%);
    padding:14px 0 22px}
  form{display:flex;gap:10px}
  input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:14px 16px;font:15px var(--sans)}
  input::placeholder{color:var(--faint)}
  input:focus{outline:none;border-color:var(--gold-dim)}
  button[type=submit]{background:var(--gold);color:#17120a;border:0;border-radius:8px;
    padding:0 24px;font:600 14px var(--sans);letter-spacing:.05em;cursor:pointer;
    text-transform:uppercase;transition:opacity .18s}
  button[type=submit]:hover{opacity:.88}
  button:disabled{opacity:.42;cursor:default}
  footer{color:var(--faint);font-size:12px;padding:0 0 26px;line-height:1.7}

  @media(max-width:560px){
    .wrap{padding:0 16px}
    .brand{flex-direction:column;gap:2px;padding-top:22px}
    .brand h1{font-size:23px}
    .prov{gap:12px;font-size:11.5px}
    .cards{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header><div class="wrap">
  <div class="brand"><h1>DAR<em>GLOBAL</em></h1></div>
  <div class="rule"></div>
  <p class="tag">Property intelligence across DarGlobal developments and Wasalt
     listings in the Kingdom of Saudi Arabia.</p>
  <div class="prov">
    <div><b id="n-pages">—</b> pages indexed</div>
    <div><b id="n-list">—</b> live listings</div>
    <div><b id="n-model">—</b></div>
  </div>
</div></header>

<main class="wrap">
  <div id="log"></div>
  <div class="chips" id="chips"></div>
</main>

<div class="composer"><div class="wrap">
  <form id="f">
    <input id="q" autocomplete="off" spellcheck="false"
           placeholder="Ask about a development, a brand partner, or a budget…">
    <button type="submit" id="send">Ask</button>
  </form>
  <footer>Answers are drawn only from scraped DarGlobal and Wasalt pages, with
    the source linked. Prices as published, in SAR.</footer>
</div></div>

<script>
const log=document.getElementById('log'), f=document.getElementById('f'),
      q=document.getElementById('q'), send=document.getElementById('send');
let history=[];

fetch('/health').then(r=>r.json()).then(d=>{
  document.getElementById('n-model').textContent=(d.model||'').split('/').pop().replace(':free','');
}).catch(()=>{});
fetch('/stats').then(r=>r.json()).then(d=>{
  document.getElementById('n-pages').textContent=d.pages;
  document.getElementById('n-list').textContent=d.listings;
}).catch(()=>{});

const SAMPLES=[
  'Which luxury brands has DarGlobal partnered with?',
  'Villas in Riyadh under 2,000,000 SAR',
  'What is being built in Oman?',
  'Apartments in Jeddah with 3 bedrooms'
];
SAMPLES.forEach(s=>{
  const b=document.createElement('button');
  b.type='button'; b.textContent=s;
  b.onclick=()=>{q.value=s; f.requestSubmit();};
  document.getElementById('chips').append(b);
});

const URL_RE=/https?:\/\/[^\s<>")\]]+/g;

// Model output is never trusted into innerHTML. Every node below is built
// with createElement/textContent, so a crafted string in a scraped page
// cannot become markup here.
function inline(el, text){
  let last=0;
  for(const m of String(text).matchAll(/\*\*(.+?)\*\*|https?:\/\/[^\s<>")\]]+/g)){
    el.append(text.slice(last, m.index));
    if(m[1]!==undefined){
      const s=document.createElement('strong'); s.textContent=m[1]; el.append(s);
    }else{
      let ok=false;
      try{ ok=['http:','https:'].includes(new URL(m[0]).protocol); }catch{}
      if(ok){
        const a=document.createElement('a');
        a.href=m[0]; a.target='_blank'; a.rel='noopener noreferrer';
        a.textContent=m[0].replace(/^https?:\/\//,'').slice(0,52)+(m[0].length>59?'…':'');
        el.append(a);
      } else el.append(m[0]);
    }
    last=m.index+m[0].length;
  }
  el.append(text.slice(last));
}

function markdown(host, text){
  host.textContent='';
  let list=null;
  for(const raw of String(text).split('\n')){
    const line=raw.trim();
    if(!line){ list=null; continue; }
    const bullet=line.match(/^[-*]\s+(.*)$/);
    const head=line.match(/^#{1,6}\s+(.*)$/);
    if(bullet){
      if(!list){ list=document.createElement('ul'); host.append(list); }
      const li=document.createElement('li'); inline(li,bullet[1]); list.append(li);
      continue;
    }
    list=null;
    if(head){
      const h=document.createElement('h3'); inline(h,head[1]); host.append(h);
    }else{
      const p=document.createElement('p');
      inline(p, line.replace(/^\*\*(.+?)\*\*:?$/,'**$1**'));
      host.append(p);
    }
  }
  if(!host.childNodes.length) host.textContent=text;
}

const fmt=n=>typeof n==='number'?n.toLocaleString('en-US'):null;

function cards(container, rows){
  if(!rows||!rows.length) return;
  const grid=document.createElement('div'); grid.className='cards';
  for(const r of rows){
    const a=document.createElement('a');
    a.className='card'; a.target='_blank'; a.rel='noopener noreferrer';
    try{ if(['http:','https:'].includes(new URL(r.url).protocol)) a.href=r.url; }catch{}

    const deal=document.createElement('div');
    deal.className='deal';
    deal.textContent=`${r.ptype||'property'} · for ${r.deal||'sale'}`;
    a.append(deal);

    const price=document.createElement('div'); price.className='price';
    price.textContent=fmt(r.price_sar)||'Price on request';
    if(r.price_sar){ const c=document.createElement('span'); c.className='cur';
      c.textContent='SAR'; price.append(c); }
    a.append(price);

    const where=document.createElement('div'); where.className='where';
    where.textContent=r.district||r.city||'—'; a.append(where);
    if(r.district&&r.city){
      const s=document.createElement('div'); s.className='sub';
      s.textContent=r.city; a.append(s);
    }

    const meta=document.createElement('div'); meta.className='meta';
    if(r.bedrooms){ const d=document.createElement('div');
      d.textContent=r.bedrooms+' bed'; meta.append(d); }
    if(r.area_sqm){ const d=document.createElement('div');
      d.textContent=fmt(Math.round(r.area_sqm))+' sqm'; meta.append(d); }
    if(meta.childNodes.length) a.append(meta);

    grid.append(a);
  }
  container.append(grid);
}

function turn(who, cls){
  const d=document.createElement('div'); d.className='turn '+cls;
  const w=document.createElement('div'); w.className='who'; w.textContent=who;
  const b=document.createElement('div'); b.className='body';
  d.append(w,b); log.append(d);
  d.scrollIntoView({block:'start',behavior:'smooth'});
  return b;
}

f.onsubmit=async e=>{
  e.preventDefault();
  const text=q.value.trim(); if(!text) return;
  q.value=''; send.disabled=true;

  turn('You','me').textContent=text;
  const body=turn('DarGlobal Assistant','bot');
  const dots=document.createElement('div'); dots.className='dots';
  dots.append(...[0,1,2].map(()=>document.createElement('span')));
  body.append(dots);

  try{
    const r=await fetch('/chat',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({message:text,history})});
    const data=await r.json();
    markdown(body, data.reply||'(empty reply)');
    cards(body, data.listings);
    if(data.tools?.length){
      const t=document.createElement('div'); t.className='trace';
      const lbl=document.createElement('span');
      lbl.textContent=[...new Set(data.tools)].join(' · ');
      t.append('retrieved via ', lbl); body.append(t);
    }
    history.push({role:'user',content:text},
                 {role:'assistant',content:(data.reply||'').slice(0,2000)});
    history=history.slice(-10);
  }catch(err){
    body.textContent='Request failed: '+err.message;
  }finally{
    send.disabled=false; q.focus();
    // composer has its own padding below, so nothing is hidden
  }
};
q.focus();
</script>
</body>
</html>
